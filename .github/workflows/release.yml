name: Publish overlay
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Check tag matches package and plugin
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const pkg=JSON.parse(await readFile('package.json','utf8'));
          const plugin=JSON.parse(await readFile('plugins/lyx-preview/.codex-plugin/plugin.json','utf8'));
          if(process.env.GITHUB_REF_NAME!==`v${pkg.version}` || plugin.version!==pkg.version)throw new Error('Version mismatch');
          NODE
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run package:release
      - name: Publish experimental source overlay
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/*.zip release/SHA256SUMS \
            --verify-tag --title "LyxBridgeCodeX $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md --prerelease
