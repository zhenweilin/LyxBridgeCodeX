<!doctype html>
<html lang="en" data-lyx-editor-version="0.3.0"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LyX Editor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:13px system-ui;color:#222;background:#e7e7e7}body{display:flex;flex-direction:column}
header,footer{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#fafafa;flex:none}header{border-bottom:1px solid #ccc}header strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}button{font:inherit;padding:6px 12px;border:1px solid #bdbdbd;background:white;border-radius:5px;cursor:pointer}button:disabled{opacity:.45;cursor:default}#add{background:#175e4d;color:white;border-color:#175e4d}#viewport{position:relative;flex:1;min-height:0;overflow:auto;background:#dedede}#surfaces{position:relative;transform-origin:top left;touch-action:none}#surfaces img{position:absolute;user-select:none;-webkit-user-drag:none}footer{border-top:1px solid #ccc}#status{flex:1;min-width:0}#connection{display:block;color:#777;font-size:11px;margin-top:3px}#notice{position:absolute;bottom:65px;left:12px;right:12px;z-index:1000;background:#fff7df;border:1px solid #d6b567;padding:10px;border-radius:5px;white-space:pre-wrap}#notice:empty{display:none}#input{position:absolute;top:30px;left:30px;width:1px;height:20px;opacity:.01;border:0;padding:0;resize:none;z-index:100;pointer-events:none;white-space:pre;overflow:hidden;caret-color:transparent}#loading{padding:30px;color:#666}
</style></head><body>
<header><strong id="filename">LyX Editor</strong><span id="saved">Connecting</span><button id="save">Save</button></header>
<main id="viewport"><div id="loading">Starting native LyX…</div><div id="surfaces" role="application" aria-label="Native LyX editing area"></div><textarea id="input" wrap="off" aria-label="LyX keyboard input" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea></main>
<footer><div id="status"><span id="selection">Select text or a formula in LyX</span><small id="connection">Connecting to this chat</small></div><button id="add" disabled>add to chat</button></footer>
<div id="notice" role="status" aria-live="polite"></div>
<script type="module">/* NATIVE_JS */</script></body></html>
